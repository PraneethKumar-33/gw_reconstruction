# Master Configuration for Gravitational Wave Signal Reconstruction
# Automatically updated with the optimal hyperparameters from the 16-trial tuning sweep

data:
  sample_rate: 4096
  segment_length: 4096
  snr_range: [5, 25]
  f_lower: 20.0
  f_upper: 500.0

dataset:
  total_samples: 5000
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

# ==============================================================================
# OPTIMAL TUNED HYPERPARAMETERS (Derived from 16-Trial Systematic Sweep)
# ==============================================================================

# 1D Temporal Convolutional Network (TCN) — Best: Trial 6 (72.38% val overlap)
tcn:
  in_channels: 1
  channels: [32, 64, 64, 128, 128, 64]
  kernel_size: 7
  dropout: 0.2              # Optimal: 0.2 prevents noise memorization (vs 0.1)
  learning_rate: 0.001
  weight_decay: 0.00001
  epochs: 50
  batch_size: 32
  early_stopping_patience: 10

# 1D Temporal Transformer — Best: Trial 5 (78.76% val overlap)
transformer:
  in_channels: 1
  patch_size: 16            # Optimal: 256 tokens captures long-range phase coherence
  d_model: 128
  nhead: 4
  num_layers: 4
  dim_feedforward: 512
  dropout: 0.1
  learning_rate: 0.002      # Optimal: 2e-3 accelerated self-attention convergence
  weight_decay: 0.00001
  epochs: 35
  batch_size: 32
  early_stopping_patience: 10

# Source-Agnostic Denoising Autoencoder (DAE) — Best: Trial 1 (86.10% val overlap)
dae:
  in_channels: 1
  mask_ratio: 0.05          # Optimal: 5% masking yields peak 86.10% reconstruction fidelity
  dropout: 0.1
  learning_rate: 0.001
  weight_decay: 0.00001
  epochs: 35
  batch_size: 32
  early_stopping_patience: 10

# Backward compatibility alias for legacy scripts
model:
  in_channels: 1
  channels: [32, 64, 64, 128, 128, 64]
  kernel_size: 7
  dropout: 0.2

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.00001
  early_stopping_patience: 10
