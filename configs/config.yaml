model:
  in_channels: 1
  channels: [32, 64, 64, 128, 128, 64]
  kernel_size: 7
  dropout: 0.1

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.00001
  early_stopping_patience: 10
  
data:
  sample_rate: 4096
  segment_length: 4096
  snr_range: [5, 25]
  f_lower: 20.0
  f_upper: 500.0

dataset:
  total_samples: 5000
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
